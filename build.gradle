plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

// OneDrive locks files in build/ while syncing, which breaks Gradle. Build outside the synced folder instead.
def localAppData = System.getenv("LOCALAPPDATA")
if (localAppData != null) {
	layout.buildDirectory = file("${localAppData}/gradle-builds/${rootProject.name}")
}

loom {
	splitEnvironmentSourceSets()
	accessWidenerPath = file("src/main/resources/survivalassistant.accesswidener")

	mods {
		"survivalassistant" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}
}

repositories {
	// Mod Menu (optional: only for its "Configure" button)
	maven { url = "https://maven.terraformersmc.com/releases" }
}

dependencies {
	// Versions live in gradle.properties.
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"

	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
	// Only compiled against: players don't need Mod Menu, the button just appears when they have it.
	compileOnly("com.terraformersmc:modmenu:${project.modmenu_version}") { transitive = false }

	testImplementation platform("org.junit:junit-bom:${project.junit_version}")
	testImplementation "org.junit.jupiter:junit-jupiter"
	testRuntimeOnly "org.junit.platform:junit-platform-launcher"
}

test {
	useJUnitPlatform()
}

processResources {
	def props = [
		version          : project.version,
		loader_version   : project.loader_version,
		minecraft_version: project.minecraft_version,
		// "0.166.2+26.3" -> "0.166.2": the build metadata after "+" is not part of the version range.
		fabric_api_min   : project.fabric_api_version.toString().takeWhile { it != '+' as char },
	]
	inputs.properties props

	filesMatching("fabric.mod.json") {
		expand props
	}
}

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(25)
	}
	withSourcesJar()
}

tasks.withType(JavaCompile).configureEach {
	options.encoding = "UTF-8"
	options.release = 25
}

jar {
	def projectName = project.name
	inputs.property "projectName", projectName

	from("LICENSE") {
		rename { "${it}_$projectName"}
	}
}

// The real build output lives outside OneDrive (see the top of this file). After every build, copy the jars
// to the project folder itself so they are also synced by OneDrive (ignored by git).
def projectFolder = projectDir
tasks.register("copyJarsToProject") {
	group = "survivalassistant"
	description = "Copies the built jars to the (OneDrive) project folder."
	def jarFiles = files(tasks.named("jar"), tasks.named("sourcesJar"))
	inputs.files(jarFiles)
	// No declared outputs: the project root also holds Gradle's own files, which Gradle can't track as output.
	def jarPrefix = "${rootProject.name}-"
	doLast {
		def keep = jarFiles.files*.name as Set
		// Remove the jars of older versions so only the latest build stays in the synced folder.
		projectFolder.listFiles()?.findAll { it.name.startsWith(jarPrefix) && it.name.endsWith(".jar") && !(it.name in keep) }
				?.each { it.delete() }
		jarFiles.files.each { f ->
			java.nio.file.Files.copy(f.toPath(), new File(projectFolder, f.name).toPath(),
					java.nio.file.StandardCopyOption.REPLACE_EXISTING)
		}
	}
}
tasks.named("assemble") { finalizedBy("copyJarsToProject") }

// Copies the built mod into a Modrinth App instance for testing: ./gradlew installToModrinth
// Instance name can be overridden with -PmodrinthInstance="Other Instance".
// Not a Copy task: Gradle creates a Copy task's destination before any action runs, so a missing instance would be
// created as a bare folder (and the Modrinth App then names the real instance "<name> (1)").
tasks.register("installToModrinth") {
	group = "survivalassistant"
	description = "Copies the mod jar into the Modrinth App instance's mods folder."
	def instance = project.findProperty("modrinthInstance") ?: "ModTesting"
	def appData = System.getenv("APPDATA")
	def instanceDir = file("${appData ?: '.'}/ModrinthApp/profiles/${instance}")
	def jarFile = tasks.named("jar").flatMap { it.archiveFile }
	dependsOn tasks.named("jar")
	def prefix = "${rootProject.name}-"
	doLast {
		if (appData == null) {
			throw new GradleException("APPDATA is not set: installToModrinth only works on Windows with the Modrinth App.")
		}
		if (!instanceDir.isDirectory()) {
			throw new GradleException("Modrinth App instance '${instance}' not found at ${instanceDir}. Use -PmodrinthInstance=\"Name\".")
		}
		def modsDir = new File(instanceDir, "mods")
		modsDir.mkdirs()
		// Remove older versions of this mod so only one copy is loaded.
		modsDir.listFiles()?.findAll { it.name.startsWith(prefix) && it.name.endsWith(".jar") }?.each {
			if (!it.delete()) {
				throw new GradleException("Could not remove ${it.name}: it is in use. Close Minecraft and run installToModrinth again.")
			}
		}
		def jar = jarFile.get().asFile
		java.nio.file.Files.copy(jar.toPath(), new File(modsDir, jar.name).toPath())
		logger.lifecycle("Installed ${jar.name} into ${instance}")
	}
}
